  midna:
    jobs:
      - trufflehog:
          filters:
            branches:
              only:
                - /^feature/midna/.+$/
                - /^fix/midna/.+$/
                - /^dependabot/pip/midna/.+$/
      - test_ci:
          requires:
            - trufflehog
      - dependabot_fix_commit:
          requires:
            - test_ci
          filters:
            branches:
              only:
                - /^dependabot/.+$/
      - build_midna:
          requires:
            - test_ci
      - audit_midna:
          requires:
            - build_midna
      - test_midna:
          requires:
            - build_midna
      - workflow_ran:
          requires:
            - trufflehog
            - test_ci
            - build_midna
            - audit_midna
            - test_midna

